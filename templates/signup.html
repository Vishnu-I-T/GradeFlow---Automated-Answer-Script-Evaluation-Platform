{% extends "base.html" %}

{% block content %}
   {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-success text-white text-center py-3">
                <h3 class="font-weight-light my-1">Create Account</h3>
            </div>
            <div class="card-body p-4">
                <form action="/signup" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" name="name" class="form-control" id="inputName" placeholder="John Doe" required>
                        <label for="inputName">Full Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control" id="inputEmail" placeholder="name@example.com" required>
                        <label for="inputEmail">Email address</label>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-floating mb-3 mb-md-0">
                                <input type="password" name="password" class="form-control" id="inputPassword" placeholder="Create a password" required>
                                <label for="inputPassword">Password</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating mb-3 mb-md-0">
                                <input type="password" class="form-control" id="inputPasswordConfirm" placeholder="Confirm password" required>
                                <label for="inputPasswordConfirm">Confirm Password</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Create Account</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <div class="small">
                    <a href="/login" class="text-decoration-none">Have an account? Go to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
